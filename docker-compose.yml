version: "3.8"
services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fr3dy
      #POSTGRES_DB: backenddb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: backend_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:fr3dy@db:5432/seguridad?schema=public
      - JWT_SECRET=supersecreto123
      - PORT=3000
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    #command: sh -c "npx prisma migrate deploy && npm run dev"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: fquejq@miumg.edu.gt
      PGADMIN_DEFAULT_PASSWORD: fr3dy
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
